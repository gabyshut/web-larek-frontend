<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Редирект для GitHub Pages
    const repoName = 'web-larek-frontend';
    const currentPath = window.location.pathname;
    
    if (!currentPath.includes(repoName)) {
      window.location.href = `/${repoName}/` + currentPath;
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
